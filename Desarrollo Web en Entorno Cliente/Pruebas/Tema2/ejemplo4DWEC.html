<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila y Tabla</title>
    <style>
        table {
            border-collapse: collapse;
            /*borde de la tabla*/
            width: 100%;
        }
        
        td {
            border: 4px solid black;
        }
    </style>
</head>

<body>
    <script>
        document.write("<table>");
        for (let i = 1; i <= 10; i++) {
            document.write("<tr>");
            for (let j = 1; j <= 10; j++)
                document.write("<td>" + i + j + "</td>");
            document.write("</tr>");
        }
        document.write("</table>");
    </script>
</body>

</html>

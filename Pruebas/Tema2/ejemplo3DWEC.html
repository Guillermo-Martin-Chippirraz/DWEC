<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo prompt</title>
</head>

<body>
    <script>
        var user = prompt("Introduzca su edad, por favor.");
        while (isNaN(user)) {
            user = prompt("La edad debe ser un número, por favor, introduzca su edad.");
        }

        if (user >= 18)
            alert("Puede pasar.");
        else
            alert("Esta web no es apta para menores de 18 años.");
    </script>
</body>

</html>

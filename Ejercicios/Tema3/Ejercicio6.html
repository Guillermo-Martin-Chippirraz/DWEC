<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 6</title>
</head>

<body>
    <script>
        var meses = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        let mesesSeleccion = [];

        let j = 0;
        for (let i = 0; i < meses.length; i++) {
            if (meses[i].startsWith("Ju") || meses[i].endsWith("ero")) {

                mesesSeleccion[j] = meses[i];
                j++;
            }
        }

        console.log(mesesSeleccion);

        let mesesString = "";

        for (let i = 0; i < mesesSeleccion.length; i++) {

            mesesString += mesesSeleccion[i];

            if (i != mesesSeleccion.length - 1)
                mesesString += ", ";

        }

        alert(mesesString);
    </script>
</body>

</html>

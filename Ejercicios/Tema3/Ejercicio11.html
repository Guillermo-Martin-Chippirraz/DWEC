<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 11</title>
</head>

<body>
    <script>
        let num1 = [1.15, 2.33, 3.99, 4.50];
        let num2 = ["cinco", "seis", "siete"];

        //Apartado 1
        let num3 = num1.concat(num2);
        console.log(num3);

        //Apartado 2
        num3.unshift("primero")
        num3.push("otros");
        console.log(num3);

        //Apartado 3
        for (let i in num3) {
            if (!isNaN(num3[i]))
                num3[i] = parseInt(num3[i]);
        }
        console.log(num3)

        //Apartado 4
        let cadenaNumeros = num3.join(" y ");
        document.write(`<p>${cadenaNumeros}</p><br>`);

        //Apartado 5
        let num4 = [];
        for (let i in num3) {
            if (!isNaN(num3[i])) {
                num4.push(num3[i]);
            }
        }
        cadenaNumeros = num4.join(" y ");
        document.write(`<p>${cadenaNumeros}</p>`);
    </script>
</body>

</html>

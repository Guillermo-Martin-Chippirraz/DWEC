<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 12</title>
</head>

<body>
    <script src="./js/Ejercicio12.js"></script>
    <script>
        let num = parseInt(prompt("Por favor, introduzca un número: "));
        let factorial = factorialNoRecursivo(num);

        while (!factorial) {
            num = prompt("El valor introducido debe ser un número entero no negativo (cualquier entero mayor a oigual que cero): ");
        }

        document.write("El factorial de " + num + " es " + factorial + ".");
    </script>
</body>

</html>

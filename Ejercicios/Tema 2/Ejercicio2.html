<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2</title>
</head>

<body>
    <script>
        let num = 0;
        for (let i = 1; i <= 15; i++) {
            if (i % 2 == 0) {
                document.write(i + "<br>");
                num++;
            }
            console.log("Iteración: " + i);
        }
        alert(`Hay un total de ${num} números pares entre el 1 y el 15.`);
    </script>
</body>

</html>
